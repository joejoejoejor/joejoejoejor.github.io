<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johannes Solibieda - Economics Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Header Section */
        header {
            padding: 80px 0 60px;
            border-bottom: 1px solid #1a1a1a;
        }

        .header-content {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888888;
            font-weight: 400;
        }

        /* Main Content */
        main {
            padding: 80px 0;
        }

        .section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a1a;
        }

        .content-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #b8b8b8;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .university {
            font-weight: 400;
            color: #d0d0d0;
        }

        /* Interests Text */
        .interests-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #b8b8b8;
            font-weight: 300;
        }

        /* LinkedIn Link */
        .linkedin-section {
            text-align: center;
            margin-top: 60px;
        }

        .linkedin-link {
            display: inline-block;
            color: #b8b8b8;
            text-decoration: none;
            padding: 12px 32px;
            border: 1px solid #2a2a2a;
            background-color: #151515;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .linkedin-link:hover {
            border-color: #404040;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Footer */
        footer {
            padding: 60px 0 40px;
            border-top: 1px solid #1a1a1a;
            text-align: center;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #666666;
            font-weight: 300;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 25px;
            }

            header {
                padding: 60px 0 40px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            main {
                padding: 60px 0;
            }

            .section {
                margin-bottom: 60px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .content-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Johannes Solibieda</h1>
                <p class="subtitle">Bachelor Student in Economics</p>
            </div>
        </header>

        <main>
            <section class="section">
                <h2 class="section-title">About</h2>
                <p class="content-text">
                    I am a Bachelor student in Economics at the <span class="university">University of St. Gallen</span>.
                </p>
            </section>

            <section class="section">
                <h2 class="section-title">Interests</h2>
                <p class="interests-text">
                    Fixed Income Investing, Securitization of Illiquid Assets, Quantitative Finance, Economics, Agriculture
                </p>
            </section>

            <div class="linkedin-section">
                <a href="https://www.linkedin.com/in/johannes-solibieda/" target="_blank" class="linkedin-link">CONNECT ON LINKEDIN</a>
            </div>
        </main>

        <footer>
            <p class="footer-text">© 2025 Johannes Solibieda</p>
        </footer>
    </div>
</body>
</html>
