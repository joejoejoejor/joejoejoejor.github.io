<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Johannes Solibieda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        /* Navigation Bar */
        nav {
            background-color: #000000;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #cccccc;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 50vh;
            min-height: 400px;
            background-color: #000000;
            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            filter: grayscale(100%);
        }

        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
            width: 90%;
            max-width: 1000px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        /* Main Content Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 60px;
        }

        /* Content Section */
        .content-section {
            padding: 120px 0;
            min-height: 50vh;
        }

        .section-intro {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .intro-text {
            font-size: 1.3rem;
            color: #333333;
            line-height: 1.8;
            font-weight: 400;
        }

        .coming-soon {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: #f5f5f5;
            border-left: 4px solid #000000;
            font-size: 1rem;
            font-weight: 500;
            color: #666666;
        }

        /* Projects Grid (for future use) */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }

        .project-card {
            background-color: #f5f5f5;
            padding: 40px;
            border-left: 4px solid #000000;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 15px;
        }

        .project-description {
            color: #333333;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #000000;
            color: #ffffff;
            padding: 60px 0;
            text-align: center;
            margin-top: 100px;
        }

        .footer-text {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .nav-container,
            .container {
                padding: 0 30px;
            }

            .hero-title {
                font-size: 3rem;
            }

            .intro-text {
                font-size: 1.1rem;
            }

            .nav-links {
                gap: 20px;
            }
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.2rem;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .content-section {
                padding: 80px 0;
            }

            .intro-text {
                font-size: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">Johannes Solibieda</a>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="projects.html">PROJECTS</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <img src="style-pictures/IMG_1148.jpeg" alt="Projects Hero Image" class="hero-image">
        <div class="hero-content">
            <h1 class="hero-title">Projects</h1>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        <section class="content-section">
            <div class="section-intro">
                <p class="intro-text">
                    This page will showcase coding and data projects.
                </p>
                <div class="coming-soon">
                    List currently empty, more coming soon
                </div>
            </div>

            <!-- Future Projects Grid -->
            <div class="projects-grid" style="display: none;">
                <!-- Project cards will be added here in the future -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2025 Johannes Solibieda</p>
    </footer>
</body>
</html>
